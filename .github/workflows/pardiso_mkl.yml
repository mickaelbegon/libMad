name: build-pardiso-mkl

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/pardiso-mkl"
  pull_request:
    paths:
      - "Project.toml"
      - "src/**"
      - "examples/basic_problem.c"
      - "CMakeLists.txt"
      - ".github/workflows/pardiso_mkl.yml"

env:
  JULIA_CPU_TARGET: "generic"
  JULIA_CUDA_USE_COMPAT: "false"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: "1.12"
      - name: Install JuliaC
        run: julia -e 'using Pkg; Pkg.add(url="https://github.com/apozharski/JuliaC.jl.git", rev="73be8587a80bbb65dab7acd71d406f72867a3571"); Pkg.Apps.add(url="https://github.com/apozharski/JuliaC.jl.git", rev="73be8587a80bbb65dab7acd71d406f72867a3571")'
      - name: Add JuliaC to PATH
        run: echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: Resolve PARDISO MKL dependencies
        run: |
          rm -f Manifest.toml
          julia --project=. -e 'using Pkg; Pkg.resolve()'
      - name: Save resolved Linux manifest
        uses: actions/upload-artifact@v4
        with:
          name: linux-julia-manifest
          path: Manifest.toml
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/install"
          cmake --build build --target install --config Release
      - name: Exercise PARDISO MKL through the C interface
        run: |
          export LD_LIBRARY_PATH="$PWD/build/install/lib:$PWD/build/install/share/julia/lib:${LD_LIBRARY_PATH:-}"
          output=$("$PWD/build/basic_problem" 2>&1)
          echo "$output"
          grep -qi "running with pardiso-mkl" <<< "$output"
          ! grep -qi "unknown type PardisoMKLSolver" <<< "$output"
